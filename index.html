[1])+' · Performance '+x[2]+'</option>').join('')+'</select></div><div class="notice">Chipset options are used as game balance data, not a claim that every chip is commercially available for licensing.</div></div><div class="card"><h3>03 / Memory & storage</h3>'+field('ram','RAM',components.ram)+field('storage','Storage',components.storage)+'</div><div class="card"><h3>04 / Hardware & design</h3>'+field('display','Display',components.display)+field('camera','Camera setup',components.camera)+field('battery','Battery',components.battery)+field('material','Build material',components.material)+'</div><div class="card wide"><h3>05 / Manufacture & launch</h3><div class="row"><span class="mini">Total production cost</span><b>'+money(c.cost*d.batch)+'</b></div><div class="row"><span class="mini">Projected gross margin</span><b class="'+(d.price>c.cost?'green':'red')+'">'+money((d.price-c.cost)*d.batch)+'</b></div><div class="actions"><button class="primary" onclick="launch()">🚀 Manufacture & launch</button><button onclick="resetD()">Reset design</button></div></div></div>'}
function market(){return head('Market & Sales','Manage demand, price and brand reputation.','GROWTH ENGINE')+'<div class="grid"><div class="card"><h3>Social media campaign</h3><p>Hype and reputation help sales.</p><div class="row"><span class="mini">Campaign cost</span><b>$1,200</b></div><button class="primary" style="width:100%;margin-top:9px" onclick="campaign()">Launch campaign</button></div><div class="card"><h3>Customer sentiment</h3><div class="big green">'+S.rep+'/100</div><div class="meter"><span style="width:'+S.rep+'%"></span></div><p>Fair prices and better specs build trust.</p></div><div class="card wide"><div class="row"><h3>Active sales cycle</h3><span class="chip">'+(S.active?'LIVE':'IDLE')+'</span></div>'+(S.active?'<div class="row"><div><div class="big">'+Math.floor(S.active.remaining).toLocaleString()+'</div><p>units remaining · '+esc(S.active.name)+'</p></div><div style="text-align:right"><div class="value">'+money(S.active.price)+'</div><p>retail price</p></div></div><div class="meter"><span style="width:'+clamp(100-S.active.remaining/S.active.batch*100,0,100)+'%"></span></div><div class="actions"><button onclick="price(-.1)">Price −10%</button><button onclick="price(.1)">Price +10%</button><button onclick="pause()">Pause cycle</button></div>':'<p>No product selling right now. Build one in R&D Lab.</p><button class="primary" onclick="go(\'lab\')">Design a phone</button>')+'</div><div class="card wide"><h3>Product portfolio</h3>'+(S.phones.length?S.phones.slice().reverse().map(p=>'<div class="listitem"><div class="row"><b>'+esc(p.name)+'</b><span class="chip">Rating '+p.rating+'</span></div><p>'+p.cpu+' · '+money(p.price)+' retail · '+p.units.toLocaleString()+' units produced</p></div>').join(''):'<p>No phones designed yet.</p>')+'</div><div class="card wide"><h3>Market intelligence</h3><div class="feeditem">📱 Rivals are competing on camera quality and battery life.</div><div class="feeditem">⚡ Chip supply is stabilizing; value devices can gain market share.</div><div class="feeditem">🌐 Flagship stores improve brand reach and customer confidence.</div></div></div>'}
function invest(){return head('Invest & Trade','Simulated markets: prices move and losses are possible.','CAPITAL MARKETS')+'<div class="grid"><div class="card wide"><div class="eyebrow">PORTFOLIO VALUE</div><div class="big green">'+money(S.stocks.reduce((a,x)=>a+x.owned*x.price,0)+cryptoWorth())+'</div><p>Investment profit tracked: '+money(S.investProfit)+'</p></div><div class="card wide"><h3>📈 Tech stock exchange</h3>'+S.stocks.map((x,i)=>'<div class="listitem"><div class="row"><div><b>'+x.symbol+'</b> <span class="mini">'+x.name+'</span><p>'+x.owned+' shares owned</p></div><div style="text-align:right"><b>'+money(x.price)+'</b><div class="'+(x.change>=0?'green':'red')+' mini">'+(x.change>=0?'+':'')+x.change.toFixed(1)+'%</div></div></div><div class="actions"><button onclick="stock('+i+',1)">Buy 10</button><button onclick="stock('+i+',-1)">Sell 10</button></div></div>').join('')+'</div><div class="card wide"><h3>₿ Tech crypto exchange</h3>'+S.crypto.map((x,i)=>'<div class="listitem"><div class="row"><div><b>'+x.symbol+'</b><p>'+x.owned.toFixed(2)+' tokens</p></div><div style="text-align:right"><b>'+money(x.price)+'</b><div class="'+(x.change>=0?'green':'red')+' mini">'+(x.change>=0?'+':'')+x.change.toFixed(1)+'%</div></div></div><div class="actions"><button onclick="crypto('+i+',1)">Buy 5</button><button onclick="crypto('+i+',-1)">Sell 5</button></div></div>').join('')+'</div>'+[['foundry','Silicon foundry',20000,'Reduces component costs'],['screen','Screen factory',15000,'Lower display sourcing costs'],['logistics','Logistics hub',10000,'Improves sales demand']].map(a=>'<div class="card"><h3>🏭 '+a[1]+'</h3><p>'+a[3]+'</p><div class="row"><span class="mini">Owned: '+S.assets[a[0]]+'</span><b>'+money(a[2])+'</b></div><button style="width:100%;margin-top:8px" onclick="asset(\''+a[0]+'\','+a[2]+')">Acquire</button></div>').join('')+'<div class="card"><h3>🏦 Bank loans</h3><p>Daily interest is added each in-game day.</p><button style="width:100%;margin:5px 0" onclick="loan(10000,.025)">Borrow $10k · 2.5%</button><button style="width:100%" onclick="loan(50000,.012)">Borrow $50k · 1.2%</button>'+S.loans.map((l,i)=>'<div class="listitem"><div class="row"><b>Balance</b><b class="red">'+money(l.balance)+'</b></div><button onclick="repay('+i+')">Repay full balance</button></div>').join('')+'</div><div class="card wide"><h3>🏙️ Retail & HQ expansion</h3><p>Flagship stores increase demand and valuation.</p><button style="width:100%;margin:5px 0" onclick="store()">Open flagship store · $25k ('+S.stores+'/5)</button><button style="width:100%" onclick="upgrade()">Upgrade headquarters · '+money(S.hq===1?15000:S.hq===2?60000:150000)+'</button></div></div>'}
function quests(){let done=qdata.filter((q,i)=>q[2]()||S.claimed.includes(i)).length;return head('Quests & Ranks','20 progressive milestones. Claim rewards as you grow.','ACHIEVEMENTS')+'<div class="grid"><div class="card"><div class="eyebrow">QUEST PROGRESS</div><div class="big cyan">'+done+' / 20</div><div class="meter"><span style="width:'+done*5+'%"></span></div></div><div class="card"><div class="eyebrow">MARKET SHARE</div><div class="big">'+share().toFixed(1)+'%</div><p>Simulated global share</p></div><div class="card wide"><h3>Mission tracker</h3>'+qdata.map((q,i)=>{let ok=q[2](),claimed=S.claimed.includes(i);return '<div class="quest"><div class="qnum">'+(claimed?'✓':String(i+1).padStart(2,'0'))+'</div><div style="flex:1"><div class="row"><b>'+q[0]+'</b><span class="chip">'+(claimed?'CLAIMED':ok?'COMPLETE':'LOCKED')+'</span></div><p>'+q[1]+'</p><div class="mini gold">Reward '+money(q[3])+'</div>'+(ok&&!claimed?'<button style="margin-top:7px" onclick="claim('+i+')">Claim reward</button>':'')+'</div></div>'}).join('')+'</div><div class="card wide"><h3>🏆 Local leaderboard</h3><p>Scores are stored locally on this device; this is not an online global ranking.</p>'+[{name:'Your NXT Empire',n:worth(),sold:S.sold},{name:'Nova Dynamics',n:Math.max(85000,worth()*.83),sold:Math.max(1800,S.sold*.75)},{name:'Quantum Mobile',n:Math.max(56000,worth()*.57),sold:Math.max(1100,S.sold*.42)}].sort((a,b)=>b.n-a.n).map((x,i)=>'<div class="listitem row"><div><b>'+(i+1)+'. '+x.name+'</b><p>'+Math.floor(x.sold).toLocaleString()+' units sold</p></div><b>'+money(x.n)+'</b></div>').join('')+'</div><div class="card wide"><h3>Save game</h3><p>Autosaves to this browser. Clearing site data removes progress.</p><div class="actions"><button onclick="exportSave()">Export save</button><button onclick="resetGame()">Reset game</button></div></div></div>'}
function render(){stats();$('#main').innerHTML=({hq,lab,market,invest,quests}[S.tab]||hq)();document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===S.tab));save()}
window.go=t=>{S.tab=t;render();buzz()};window.setName=v=>{S.d.name=v;let h=$('#main h2');if(h&&S.tab==='lab')h.textContent=v||'Untitled NXT phone';save()};window.setD=(k,v)=>{S.d[k]=k==='price'||k==='batch'?+v:+v;render()};
window.resetD=()=>{S.d=fresh().d;render();toast('Design reset')};
window.launch=()=>{let d=S.d,c=calc();if(!d.name.trim())return toast('Enter a model name');if(d.price<=c.cost)return toast('Retail price must exceed manufacturing cost');if(d.price>5000||d.price<30)return toast('Price must be $30–$5,000');if(S.active)return toast('Finish or pause current sales first');let total=c.cost*d.batch;if(S.cash<total)return toast('Not enough cash for production');S.cash-=total;let p={name:d.name.trim(),price:+d.price,cost:c.cost,batch:+d.batch,units:+d.batch,remaining:+d.batch,rating:c.rating,cpu:CPUs[+d.cpu][0],spec:c.spec};S.phones.push(p);S.active={...p};S.hype=clamp(S.hype+5,0,100);log('Launched '+p.name+' with '+p.cpu+'.');S.tab='market';render();toast('Manufactured and launched!');buzz()};
window.campaign=()=>{if(S.cash<1200)return toast('Need $1,200');S.cash-=1200;S.hype=clamp(S.hype+18,0,100);S.rep=clamp(S.rep+2,0,100);S.campaigns++;log('Marketing campaign boosted brand hype.');render();toast('Campaign launched · Hype +18')};
window.price=dif=>{if(!S.active)return;S.active.price=Math.max(S.active.cost+1,Math.round(S.active.price*(1+dif)));let p=S.phones.find(p=>p.name===S.active.name);if(p)p.price=S.active.price;render();toast('Retail price updated')};window.pause=()=>{S.active=null;render();toast('Sales paused; remaining inventory kept')};
window.upgrade=()=>{let c=S.hq===1?15000:S.hq===2?60000:150000;if(S.hq>=3)return toast('Tech Tower already unlocked');if(S.cash<c)return toast('Need '+money(c));S.cash-=c;S.hq++;S.rep=clamp(S.rep+5,0,100);log('Headquarters upgraded to level '+S.hq);render();toast('HQ upgraded')};
window.stock=(i,dir)=>{let x=S.stocks[i],qty=10;if(dir>0){let c=x.price*qty;if(S.cash<c)return toast('Not enough cash');S.cash-=c;x.owned+=qty;S.stockInvested+=c}else{if(x.owned<qty)return toast('Need 10 shares to sell');let val=x.price*qty;S.cash+=val;x.owned-=qty;S.investProfit+=val-x.price*qty*.9}render()};
window.crypto=(i,dir)=>{let x=S.crypto[i],qty=5;if(dir>0){let c=x.price*qty;if(S.cash<c)return toast('Not enough cash');S.cash-=c;x.owned+=qty;S.stockInvested+=c}else{if(x.owned<qty)return toast('Need 5 tokens');let val=x.price*qty;S.cash+=val;x.owned-=qty;S.investProfit+=val}render()};
window.asset=(k,c)=>{if(S.cash<c)return toast('Not enough cash');S.cash-=c;S.assets[k]++;log('Acquired '+k+' supply-chain asset.');render();toast('Asset acquired')};window.loan=(n,r)=>{S.cash+=n;S.loans.push({balance:n,rate:r});log('Bank loan received: '+money(n));render();toast('Loan approved')};window.repay=i=>{let l=S.loans[i];if(S.cash<l.balance)return toast('Not enough cash to repay');S.cash-=l.balance;S.loans.splice(i,1);render();toast('Loan repaid')};window.store=()=>{if(S.cash<25000)return toast('Need $25,000');S.cash-=25000;S.stores++;S.rep=clamp(S.rep+3,0,100);render();toast('Flagship store opened')};
window.claim=i=>{if(S.claimed.includes(i)||!qdata[i][2]())return;S.cash+=qdata[i][3];S.claimed.push(i);log('Quest complete: '+qdata[i][0]);render();toast('Reward claimed: '+money(qdata[i][3]))};
window.exportSave=()=>{let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.href=u;a.download='nxt-empire-save.json';a.click();URL.revokeObjectURL(u)};window.resetGame=()=>{if(confirm('Reset all NXT Empire progress?')){S=fresh();save();render()}};
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>go(b.dataset.tab)));
function tick(){let now=Date.now(),elapsed=Math.min(2,(now-S.lastTick)/1000);S.lastTick=now;if(S.active&&elapsed>0){let p=S.active,priceRatio=p.price/Math.max(1,p.cost),comp=clamp(1.45-priceRatio*.55,.18,1.25),rate=(1.3+S.hype*.055+S.rep*.018)*(p.rating/55)*comp*(1+S.stores*.06),sold=Math.min(p.remaining,rate*elapsed*3);if(sold>0){let rev=sold*p.price;S.cash+=rev;S.revenue+=rev;S.sold+=sold;S.active.remaining-=sold;S.profit+=rev-sold*p.cost;S.totalProfit+=rev-sold*p.cost;if(S.active.remaining<=0){S.bestCycle=Math.max(S.bestCycle,S.active.batch);S.rep=clamp(S.rep+(p.rating>=70?3:1),0,100);S.hype=clamp(S.hype+4,0,100);log(p.name+' sold out!');S.active=null;toast('PRODUCT SOLD OUT!')}}}
if(now-S.lastDayAt>=60000){S.lastDayAt=now;S.day++;S.cash-=750*S.hq;S.expenses+=750*S.hq;S.loans.forEach(l=>l.balance*=1+l.rate);S.stocks.forEach(x=>{let old=x.price;x.price=Math.max(1,x.price*(1+(Math.random()-.47)*.08));x.change=(x.price/old-1)*100});S.crypto.forEach(x=>{let old=x.price;x.price=Math.max(.1,x.price*(1+(Math.random()-.48)*.22));x.change=(x.price/old-1)*100});S.history.push({day:S.day,profit:S.profit});S.history=S.history.slice(-14);S.profit=0;S.hype=clamp(S.hype-1,0,100);log('Day '+S.day+': expenses paid and markets refreshed.')}save();stats();if(S.tab==='hq'||S.tab==='market')render()}
S.lastDayAt=Date.now();render();setInterval(tick,1000);
})();
</script></body></html>
